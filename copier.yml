# Git entry point for the Repoman templates.
!include src/repoman/copier.yml
---
_subdirectory: "{% if repoman_command_extension %}src/repoman/extentions/command_template/{{ '{{command_name}}' }}{% elif repoman_astro %}src/repoman/astro_template/template{% else %}src/repoman/main_template{% endif %}"

_skip_if_exists:
  - /src/content/profile.json
  - /src/styles/custom.css

repoman_astro:
  type: bool
  default: false

repoman_command_extension:
  type: bool
  default: false

command_name:
  type: str
  default: ""
  when: "{{ repoman_command_extension }}"

command_description:
  type: str
  default: "{{ command_name }} command"
  when: "{{ repoman_command_extension }}"
