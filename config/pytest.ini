[pytest]
python_files =
  test_*.py
  *_test.py
addopts =
  -vvv
  --cov
  --cov-config config/converage.ini
  --cov-report xml
  --cov-report html
  --cov-report term-missing
  --strict-markers
  --strict-config
  --tb=short
  --maxfail=10
  --durations=10
testpaths =
  tests/
pythonpath =
  src/
markers =
  unit: Unit tests that can run in isolation
  integration: Integration tests that may have dependencies
  cli: CLI command tests
  utils: Utility function tests
  slow: Slow running tests
  isolated: Tests that must run in isolation
filterwarnings =
  error
  ignore::DeprecationWarning
  ignore::PendingDeprecationWarning
  # Ignore specific warnings that are not actionable
  ignore:.*rsyncdir:DeprecationWarning:xdist
  ignore:.*pkg_resources:DeprecationWarning
  ignore:.*imp module:DeprecationWarning
  ignore:.*distutils:DeprecationWarning
  # Ignore unraisable exception warnings from copier library
  ignore:Exception ignored in.*:pytest.PytestUnraisableExceptionWarning
  ignore:.*unclosed scandir iterator.*:ResourceWarning
