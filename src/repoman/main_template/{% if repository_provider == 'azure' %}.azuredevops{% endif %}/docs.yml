name: {{ python_package_import_name }} Docs 

pr:
  branches:
    include:
      - main
trigger:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_docs
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  strategy:
    matrix:
      Python3.12:
        python.version: '3.12'

  variables:
  - group: Azure-Static-Web-Apps-{{ python_package_import_name }}-variable-group
  
  steps:
  - checkout: self
    submodules: true

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'

  - script: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
    displayName: 'Install uv'

  - script : |
      make docs 
      echo "##vso[task.setvariable variable=uv_cache_dir]`uv cache dir`"
    displayName: 'Build Docs'


  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_FOREST_0BB1D511E)
###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
# For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
      app_location: "/site/" # App source code path
      api_location: "" # Api source code path - optional
      output_location: "/" # Built app content directory - optional
###### End of Repository/Build Configurations ######