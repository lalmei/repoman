# CONFIGURATION -------------------------
_min_copier_version: "9"
_envops:
  autoescape: false
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true
_subdirectory: template/
_templates_suffix: .jinja
_preserve_symlinks: true
_jinja_extensions:
- copier_template_extensions.TemplateExtensionLoader
- extensions.py:CurrentYearExtension
- extensions.py:GitExtension
- extensions.py:SlugifyExtension
_tasks:
  - git init


# PROMPT --------------------------------

ci:
  type: str
  help: Your repository URL (hostname; derived from repository provider)
  default: "{{ repository_provider }}.com"
  choices:
  - github.com
  - gitlab.com

project_name:
  type: str
  help: Your project name
  placeholder: my-cpp-library
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits, and hyphens only.{% endif %}"

project_description:
  type: str
  help: Your project description

author_fullname:
  type: str
  help: Your full name
  default: "{{ 'Leandro G. Almeida' | git_user_name }}"

author_email:
  type: str
  help: Your email
  default: "{{ 'leandro.g.almeida@gmail.com' | git_user_email }}"

author_username:
  type: str
  help: Your username (e.g. on GitHub)
  default: "lalmei"

repository_provider:
  type: str
  help: Your repository provider
  default: github
  choices:
  - github
  - gitlab

repository_namespace:
  type: str
  help: Your repository namespace
  default: "{{ author_username }}"

repository_name:
  type: str
  help: Your repository name
  default: "{{ project_name | slugify }}"

copyright_holder:
  type: str
  help: The name of the person/entity holding the copyright
  default: "{{ author_fullname }}"

copyright_holder_email:
  type: str
  help: The email of the person/entity holding the copyright
  default: "{{ author_email }}"

copyright_date:
  type: str
  help: The copyright date
  default: "{{ current_year }}"

copyright_license:
  type: str
  help: Your project's license
  default: MIT
  choices:
    Apache License 2.0: Apache-2.0
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    ISC License: ISC
    MIT License: MIT

cpp_namespace:
  type: str
  help: C++ namespace and public include directory
  default: "{{ project_name | slugify('_') }}"
  validator: "{% if not (cpp_namespace | regex_search('^[a-z][a-z0-9_]*$')) %}Use a valid lowercase C++ namespace identifier.{% endif %}"

cpp_library_name:
  type: str
  help: Meson library target name
  default: "{{ project_name | slugify('_') }}"
  validator: "{% if not (cpp_library_name | regex_search('^[a-z][a-z0-9_]*$')) %}Use lowercase letters, digits, and underscores only.{% endif %}"

cpp_standard:
  type: str
  help: C++ language standard
  default: c++17
  choices:
  - c++17
  - c++20
  - c++23

cpp_build_cli:
  type: bool
  help: Build the example command-line executable
  default: true

cpp_build_examples:
  type: bool
  help: Build example programs
  default: true

cpp_build_tests:
  type: bool
  help: Build test executables
  default: true

cpp_build_python_bindings:
  type: bool
  help: Build Python bindings
  default: true
