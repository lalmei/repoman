_min_copier_version: "9"
_templates_suffix: .jinja

instance_name:
  type: str
  default: graphrag

python_package_import_name:
  type: str

python_package_command_line_name:
  type: str
  default: "{{ python_package_import_name }}"

fastapi_enabled:
  type: bool
  default: false

rag_enabled:
  type: bool
  default: true

include_health_endpoints:
  type: bool
  default: true
