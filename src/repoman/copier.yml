# CONFIGURATION -------------------------
_min_copier_version: "9"
_envops:
  autoescape: false
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true
_subdirectory: main_template/
_templates_suffix: .jinja
_preserve_symlinks: true
_jinja_extensions:
- copier_template_extensions.TemplateExtensionLoader
- extensions.py:CurrentYearExtension
- extensions.py:GitExtension
- extensions.py:SlugifyExtension
_skip_if_exists:
- CHANGELOG.md
_tasks:
- git init


# PROMPT --------------------------------

ci:
  type: str
  help: Your repository URL (hostname; derived from repository provider)
  default: "{{ repository_provider }}.com"
  choices:
  - github.com
  - gitlab.com
  - azure.com

project_name:
  type: str
  help: Your project name
  placeholder: my-awesome-project
  validator: "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits, and hyphens only.{% endif %}"

project_description:
  type: str
  help: Your project description

author_fullname:
  type: str
  help: Your full name
  default: "{{ 'Leandro G. Almeida' | git_user_name }}"

author_email:
  type: str
  help: Your email
  default: "{{ 'leandro.g.almeida@gmail.com' | git_user_email }}"

author_username:
  type: str
  help: Your username (e.g. on GitHub)
  default: "lalmei"

repository_provider:
  type: str
  help: Your repository provider
  default: github
  choices:
  - github
  - gitlab
  - azure

repository_namespace:
  type: str
  help: Your repository namespace
  default: "{{ author_username }}"

repository_name:
  type: str
  help: Your repository name
  default: "{{ project_name | slugify }}"

copyright_holder:
  type: str
  help: The name of the person/entity holding the copyright
  default: "{{ author_fullname }}"

copyright_holder_email:
  type: str
  help: The email of the person/entity holding the copyright
  default: "{{ author_email }}"

copyright_date:
  type: str
  help: The copyright date
  default: "{{ current_year }}"

copyright_license:
  type: str
  help: Your project's license
  default: ISC
  choices:
    Academic Free License v3.0: AFL-3.0
    Apache License 2.0: Apache-2.0
    Artistic License 2.0: Artistic-2.0
    BSD 2-Clause "Simplified" License: BSD-2-Clause
    BSD 3-Clause Clear License: BSD-3-Clause-Clear
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    Boost Software License 1.0: BSL-1.0
    Creative Commons Attribution 4.0 International: CC-BY-4.0
    Creative Commons Attribution Share Alike 4.0 International: CC-BY-SA-4.0
    Creative Commons Zero v1.0 Universal: CC0-1.0
    Do What The F*ck You Want To Public License: WTFPL
    Educational Community License v2.0: ECL-2.0
    Eclipse Public License 1.0: EPL-1.0
    Eclipse Public License 2.0: EPL-2.0
    European Union Public License 1.1: EUPL-1.1
    European Union Public License 1.2: EUPL-1.2
    GNU Affero General Public License v3.0: AGPL-3.0
    GNU General Public License v2.0 only: GPL-2.0
    GNU General Public License v3.0 only: GPL-3.0
    GNU Lesser General Public License v2.1 only: LGPL-2.1
    GNU Lesser General Public License v3.0 only: LGPL-3.0
    ISC License: ISC
    LaTeX Project Public License v1.3c: LPPL-1.3c
    MIT License: MIT
    Mozilla Public License 2.0: MPL-2.0
    Microsoft Public License: MS-PL
    Microsoft Reciprocal License: MS-RL
    University of Illinois/NCSA Open Source License: NCSA
    SIL Open Font License 1.1: OFL-1.1
    Open Software License 3.0: OSL-3.0
    PostgreSQL License: PostgreSQL
    The Unlicense: Unlicense
    zlib License: Zlib

python_package_distribution_name:
  type: str
  help: Your Python package distribution name (for `pip install NAME`)
  default: "{{ project_name | slugify }}"

python_package_import_name:
  type: str
  help: Your Python package import name (for `import NAME` in Python code)
  default: "{{ project_name | slugify('_') }}"

python_package_command_line_name:
  type: str
  help: Your CLI name if any (for use in the shell)
  default: "{{ project_name | slugify }}"

python_distribution_name:
  type: str
  help: Python distribution name for container images (used in Azure DevOps)
  default: "{{ python_package_distribution_name }}"

container_registry:
  type: str
  help: Container registry URL for Docker images (e.g., Azure Container Registry name or Docker Hub)
  default: "docker.io"

python_notebooks:
  type: bool
  help: Include Jupyter notebooks support (notebooks folder and ipykernel)
  default: false

# FastAPI application (when fastapi_enabled)
fastapi_enabled:
  type: bool
  help: Enable FastAPI application structure
  default: true

fastapi_docs_url:
  type: str
  help: FastAPI documentation endpoint path
  default: "/docs"
  when: "{{ fastapi_enabled }}"

fastapi_api_prefix:
  type: str
  help: API route prefix for all endpoints
  default: "/api"
  when: "{{ fastapi_enabled }}"

fastapi_debug:
  type: bool
  help: Enable FastAPI debug mode
  default: false
  when: "{{ fastapi_enabled }}"

include_health_endpoints:
  type: bool
  help: Include health check and ready endpoints
  default: true
  when: "{{ fastapi_enabled }}"

aiohttp_timeout:
  type: int
  help: HTTP client timeout in seconds
  default: 2
  when: "{{ fastapi_enabled }}"

aiohttp_pool_size:
  type: int
  help: HTTP client connection pool size
  default: 100
  when: "{{ fastapi_enabled }}"

# RAG (retrieval-augmented generation)
rag_enabled:
  type: bool
  help: Include RAG (retrieval-augmented generation) modules and CLI/API
  default: false

# Dataset module (PyTorch-oriented)
dataset_enabled:
  type: bool
  help: Include dataset module for PyTorch data loading and config
  default: false

